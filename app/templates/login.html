{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow login-card">

            <div class="card-header bg-bosch text-white text-center py-4">
                <i class="bi bi-box-seam-fill" style="font-size: 2.5rem;"></i>
                <h4 class="mt-2 mb-0">Lab Inventory</h4>
                <small class="opacity-75">Secure Sign In</small>
            </div>

            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('main.login') }}">

                    <div class="mb-3">
                        <label for="nt_id" class="form-label fw-semibold">
                            NT ID
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text" class="form-control"
                                   id="nt_id" name="nt_id"
                                   value="{{ entered_nt_id or '' }}"
                                   placeholder="Format: KNA1COB"
                                   required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">
                            Password
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input type="password" class="form-control"
                                   id="password" name="password"
                                   placeholder="Enter your password"
                                   required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-bosch w-100 py-2">
                        <i class="bi bi-box-arrow-in-right"></i>&nbsp; Login
                    </button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <div class="text-muted small mb-2">New user?</div>
                    <a href="{{ url_for('main.register') }}" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-person-plus-fill"></i>&nbsp; Register
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
