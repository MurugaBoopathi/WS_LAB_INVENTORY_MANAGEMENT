; --- SMTP Mail Server ---
SMTP_SERVER     = your-smtp-server
SMTP_PORT       = 25
SMTP_USE_TLS    = False
SMTP_USERNAME   =
SMTP_PASSWORD   =

; --- Server ---
PORT            = 5000
